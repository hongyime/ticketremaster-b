# Explicit development overlay; requires Docker Compose 2.24.4+.
name: ticketremaster-dev
services:
  credit-transaction-service:
    image: ticketremaster-dev/credit-transaction-service:local
    pull_policy: never
    build:
      target: dev
    restart: 'no'
    init: true
    environment:
      WATCHFILES_FORCE_POLLING: 'true'
      WATCHFILES_POLL_DELAY_MS: '500'
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
    - type: bind
      source: ./services/credit-transaction-service
      target: /app
    - type: bind
      source: ./shared
      target: /shared
      read_only: true
    - type: bind
      source: ./shared
      target: /app/shared
      read_only: true
    env_file: !override
    - .env.dev
  event-service:
    image: ticketremaster-dev/event-service:local
    pull_policy: never
    build:
      target: dev
    restart: 'no'
