name: Purchase HTTP checks

on:
  push:
    branches: [main, maintenance/ticket-http-*]
    paths:
      - orchestrators/ticket-purchase-orchestrator/**
      - shared/**
      - .github/workflows/purchase-http-checks.yml
  pull_request:
    paths:
      - orchestrators/ticket-purchase-orchestrator/**
      - shared/**
      - .github/workflows/purchase-http-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purchase-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r orchestrators/ticket-purchase-orchestrator/requirements.txt
      - name: Synthetic HTTP and purchase workflow checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          JWT_SECRET: synthetic-test-key-at-least-32-characters
          OUTSYSTEMS_API_KEY: synthetic-api-key
          CREDIT_SERVICE_URL: http://credit-mock
          REDIS_URL: ''
        run: python -m pytest -q orchestrators/ticket-purchase-orchestrator/tests
