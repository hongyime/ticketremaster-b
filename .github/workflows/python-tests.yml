name: Python Service Tests

# Runs each backend service's pytest suite in isolation (matrix job per
# service avoids cross-service import collisions - several services share
# module names like app.py/models.py).
on:
  push:
    branches: [main, master]
    paths:
      - "services/**.py"
      - "services/**/requirements.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/**.py"
      - "services/**/requirements.txt"
      - ".github/workflows/python-tests.yml"

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - credit-transaction-service
          - event-service
          - marketplace-service
          - notification-service
          - otp-wrapper
          - seat-inventory-service
          - seat-service
          - stripe-wrapper
          - ticket-log-service
          - ticket-service
          - transfer-service
          - user-service
          - venue-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Check for tests directory
        id: has_tests
        run: |
          if [ -d "tests" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No tests/ directory for ${{ matrix.service }} - skipping (tracked, not a failure)."
          fi

      - name: Install dependencies
        if: steps.has_tests.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        if: steps.has_tests.outputs.present == 'true'
        run: python -m pytest tests/ -v
