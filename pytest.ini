[pytest]
# NOTE: there is no root-level tests/ directory. Each backend service under
# services/<name>/ has its own tests/ + conftest.py and must be run from
# within that service's directory (several services share module names like
# app.py/models.py, so a single repo-wide pytest run would collide on imports).
# CI runs these via .github/workflows/python-tests.yml (matrix job per service).
# Locally: cd services/<name> && pytest tests/ -v
