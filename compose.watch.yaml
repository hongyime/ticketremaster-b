# Explicit SMB overlay; Compose 2.32.2+. Apply after compose.dev.yaml.
# Every source rule syncs into the existing container; dependencies rebuild explicitly.
x-dev-watch-ignore: &dev-watch-ignore
  - "**/.[eE][nN][vV]*"
  - "**/*[sS][eE][cC][rR][eE][tT]*"
  - "**/*[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]*"
  - "**/*.[pP][eE][mM]"
  - "**/*.[kK][eE][yY]"
  - "**/*.[pP]12"
  - "**/*.[pP][fF][xX]"
  - "**/__pycache__/**"
  - "**/*.py[cod]"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.agents/**"
  - "**/.pytest_cache/**"
  - "**/requirements*.txt"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/pyproject.toml"
  - "**/uv.lock"
  - "**/Dockerfile*"
x-shared-watch-ignore: &shared-watch-ignore
  - "**/.[eE][nN][vV]*"
  - "**/*[sS][eE][cC][rR][eE][tT]*"
  - "**/*[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]*"
  - "**/*.[pP][eE][mM]"
  - "**/*.[kK][eE][yY]"
  - "**/*.[pP]12"
  - "**/*.[pP][fF][xX]"
  - "**/__pycache__/**"
  - "**/*.py[cod]"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.agents/**"
  - "**/.pytest_cache/**"
  - "**/requirements*.txt"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/pyproject.toml"
  - "**/uv.lock"
  - "**/Dockerfile*"
  - "!secrets.py"
services:
  auth-orchestrator:
    volumes: !reset []
    develop:
      watch:
        - action: sync
          path: ./orchestrators/auth-orchestrator
          target: /app
          initial_sync: true
          ignore: *dev-watch-ignore
        - action: sync
          path: ./shared
          target: /shared
          initial_sync: true
          ignore: *shared-watch-ignore
        - action: sync
          path: ./shared
          target: /app/shared
          initial_sync: true
          ignore: *shared-watch-ignore
  credit-orchestrator:
